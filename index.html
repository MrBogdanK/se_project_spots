<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="./pages/index.css" />

    <title>Spots</title>
    <meta name="keywords" content="..." />
    <meta name="author" content="Bogdan Kuznetsov" />
    <meta name="description" content="..." />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spotlogo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="Bessie Coleman"
            class="profile__avatar"
          />
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img src="./images/pencil.svg" alt="Pencil icon" />Edit-profile
            </button>
          </div>
          <button type="button" class="profile__add-button">
            <img src="./images/plusicon.svg" alt="plus icon" />New Post
          </button>
        </section>
        <section class="cards page__section">
          <template id="cardTemplate">
            <li class="card">
              <img
               class="card__image"
              />
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button
                  class="card__like-button"
                  type="button"
                  aria-label="Like card"
                ></button>
                <button
                  class= "card__trash-button"
                  type="button"
                  aria-label="trash card"
                ></button>
              </div>
            </li>
 </template>
          <ul class="cards__list">
           
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">2024 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="./images/closed-button.png"
              alt="Close"
              aria-label="Close modal"
            />
          </button>
          <h3 class="modal__title">Edit profile</h3>
          <form class="modal__form">
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                required
              />
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                required
              />
            </label>

            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img
              src="./images/closed-button.png"
              alt="Close"
              aria-label="Close modal"
            />
          </button>
          <h3 class="modal__title">New Post</h3>
          <form class="modal__form">
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Place a link to the picture"
                required
              />
            </label>
            <label for="card-caption-input" class="modal__label"
              >Caption
              <input
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                required
              />
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>
      <div class ="modal" id="enlarge-picture-modal">
  <div class="modal__container modal__container_type_image">
  <button type="button" class="modal__close-button modal__close-button_type-image">
    <img 
    src="./images/closeBTN.svg"
    alt="Close" 
    aria-label="Close modal"/>
  </button>
  <img class ="modal__card-image"
  src ="#"
  alt=""/>
  <p class="modal__card-title"></p>
</div> 
</div> 
 </div>
    <script src="./scripts/index.js"></script>

  </body>
</html>
